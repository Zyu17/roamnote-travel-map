name: Deploy Roamnote to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      import_images:
        description: Prepare and import the reviewed destination photo bundle
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: roamnote-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate invitation configuration
        run: node -e 'const code = (process.env.REGISTRATION_CODE ?? "").trim(); if (code.length < 4 || code.length > 256) { console.error("REGISTRATION_CODE must contain 4 to 256 characters."); process.exit(1); }'
        env:
          REGISTRATION_CODE: ${{ secrets.REGISTRATION_CODE }}
      - name: Install dependencies
        run: npm ci
      - name: Check travel route calculations
        run: node scripts/check-travel-routes.mjs
      - name: Build Worker
        run: npm run build:worker
      - name: Check destination photo API
        run: node scripts/check-place-images.mjs
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Prepare reviewed destination photos
        if: github.event_name == 'workflow_dispatch' && inputs.import_images
        run: npm run images:prepare
      - name: Import destination photos into R2 and D1
        if: github.event_name == 'workflow_dispatch' && inputs.import_images
        run: npm run images:import -- --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish Worker and update server secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
          secrets: |
            AMAP_JS_KEY
            AMAP_SECURITY_CODE
            AMAP_WEB_SERVICE_KEY
            REGISTRATION_CODE
        env:
          AMAP_JS_KEY: ${{ secrets.AMAP_JS_KEY }}
          AMAP_SECURITY_CODE: ${{ secrets.AMAP_SECURITY_CODE }}
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
          REGISTRATION_CODE: ${{ secrets.REGISTRATION_CODE }}
      - name: Check deployed account pages and authorization
        run: node scripts/check-deployed-auth.mjs
        env:
          ROAMNOTE_URL: https://roamnote-travel-map.lizeyu17.workers.dev
      - name: Check imported destination photos on the live website
        if: github.event_name == 'workflow_dispatch' && inputs.import_images
        run: node scripts/check-deployed-place-images.mjs
        env:
          ROAMNOTE_URL: https://roamnote-travel-map.lizeyu17.workers.dev
      - name: Check AMap routing provider
        continue-on-error: true
        run: node scripts/check-amap-routing.mjs
        env:
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
